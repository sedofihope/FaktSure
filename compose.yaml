services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: faktsure
      POSTGRES_USER: faktsure
      POSTGRES_PASSWORD: faktsure-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faktsure -d faktsure"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://faktsure:faktsure-local-only@db:5432/faktsure
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      STORAGE_ROOT: /data/documents
      PORT: 8000
    ports:
      - "127.0.0.1:${FAKTSURE_API_PORT:-8000}:8000"
    volumes:
      - document_data:/data/documents
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  document_data:
